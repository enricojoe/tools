name: Release

# Pushing a tag like v1.2.3 builds the image and pushes it as 1.2.3, 1.2 and latest.
# Tests run on the pull request (ci.yml), not here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          # v1.2.3 -> 1.2.3, 1.2, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time; a newer tag waits instead of cancelling a running deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/tools' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CONFIG

      - name: Copy deploy files
        run: |
          # shellcheck disable=SC2029 # DEPLOY_PATH is meant to expand here
          ssh server "mkdir -p $DEPLOY_PATH"
          scp deploy/compose.prod.yml deploy/deploy.sh "server:$DEPLOY_PATH/"

      - name: Pull and start
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image="docker.io/$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY#*/}:${GITHUB_REF_NAME#v}"
          # shellcheck disable=SC2029 # the arguments are meant to expand here
          ssh server "bash $DEPLOY_PATH/deploy.sh $image"
