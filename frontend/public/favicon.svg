<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .ink { stroke: #172033; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #0b1020; } }
  </style>
  <!-- Tilted sticker tile with a red offset shadow, like the in-app brand mark. -->
  <g transform="rotate(-6 32 32)">
    <rect x="9" y="11" width="48" height="48" rx="14" fill="#dc2626"/>
    <rect class="ink" x="5" y="6" width="48" height="48" rx="14" fill="#1d4ed8" stroke-width="4"/>
    <!-- Toolbox: handle, box, lid line and a red latch. -->
    <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22.5 22v-3a3 3 0 0 1 3-3h7a3 3 0 0 1 3 3v3"/>
      <rect x="13" y="22" width="32" height="22" rx="4"/>
      <path d="M13 31h32"/>
    </g>
    <rect x="25.5" y="27.5" width="7" height="7" rx="2" fill="#dc2626" stroke="#fff" stroke-width="2.5"/>
  </g>
</svg>
